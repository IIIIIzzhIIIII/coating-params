<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6B35">
<title>喷涂数据参数库</title>
<style>
  :root{
    --orange:#FF6B35;
    --orange-dark:#E2551F;
    --orange-soft:#FFF1EC;
    --blue:#1E6FE8;
    --blue-soft:#EAF2FE;
    --green:#1E8E4E;
    --green-soft:#E8F7EE;
    --text:#333;
    --gray:#f5f5f5;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;padding:0 0 82px;
    background:var(--gray);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}

  /* ============ 顶部固定栏 ============ */
  .hdr{
    position:sticky;top:0;z-index:60;
    background:linear-gradient(180deg,#FF7A45 0%,#FF6B35 100%);
    box-shadow:0 2px 10px rgba(255,107,53,.28);
    padding:10px 16px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  .hdr-in{max-width:600px;margin:0 auto}
  .hdr h1{margin:0;color:#fff;font-size:20px;font-weight:700;letter-spacing:.5px;line-height:1.3}
  .hdr .sub{margin:3px 0 8px;color:rgba(255,255,255,.86);font-size:12px;letter-spacing:1px}
  .search{position:relative}
  .search input{
    width:100%;height:44px;border:0;outline:none;
    border-radius:22px;padding:0 46px 0 40px;
    font-size:14px;color:#333;background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .search input::placeholder{color:#b0b0b0}
  .sicon{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
  .clear{
    position:absolute;right:9px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border:0;border-radius:50%;
    background:#ececec;color:#7d7d7d;font-size:15px;line-height:1;
    display:none;align-items:center;justify-content:center;padding:0 0 1px;cursor:pointer;
  }
  .clear.show{display:flex}

  /* ============ 主体 ============ */
  .main{max-width:600px;margin:0 auto;padding:0 0 18px}
  .pad{padding:0 16px}

  /* 横向标签 */
  .chips{
    display:flex;gap:8px;overflow-x:auto;
    padding:2px 16px 4px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:0;
    background:#eaeaea;color:#444;
    font-size:13px;line-height:1.4;
    padding:7px 15px;border-radius:999px;
    white-space:nowrap;cursor:pointer;
    transition:background .18s,color .18s,box-shadow .18s;
  }
  .chip.active{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(255,107,53,.32)}
  .cat-wrap{padding-top:8px}

  /* 场景筛选行 */
  .scene-row{display:flex;align-items:center;gap:8px;padding:4px 16px 10px}
  .row-label{flex:0 0 auto;font-size:12px;color:var(--muted)}
  .scene-row .chips{flex:1;min-width:0;padding:0}
  .scene-row .chip{
    background:#fff;border:1px solid #e6e6e6;
    padding:5px 12px;font-size:12px;box-shadow:none;color:#666;
  }
  .scene-row .chip.active{border-color:var(--orange);color:#fff;background:var(--orange)}

  /* 膜厚筛选面板 */
  .fp{
    background:#fff;border-radius:12px;margin:0 16px 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden;
  }
  .fp-head{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:12px 14px;border:0;background:none;
    font-size:13px;color:#444;text-align:left;cursor:pointer;
  }
  .fp-head .chev{margin-left:auto;color:#c0c0c0;font-size:11px;transition:transform .25s ease;line-height:1}
  .fp.open .fp-head .chev{transform:rotate(180deg)}
  .fp-val{font-size:12px;color:var(--orange-dark)}
  .fp-body{
    max-height:0;overflow:hidden;opacity:0;
    transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s ease;
  }
  .fp.open .fp-body{opacity:1}
  .fp-inner{padding:0 14px 14px}
  .frow{display:flex;gap:10px}
  .finput{flex:1;min-width:0}
  .finput label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .finput input{
    width:100%;height:38px;border:1px solid #e3e3e3;border-radius:8px;
    background:#fafafa;padding:0 10px;font-size:13px;color:#333;outline:none;
    transition:border-color .18s,background .18s;
  }
  .finput input:focus{border-color:var(--orange);background:#fff}
  .fhint{font-size:11px;color:#a8a8a8;line-height:1.5;margin-top:8px}
  .reset{
    width:100%;height:36px;margin-top:10px;
    border:1px solid #ffd3c2;border-radius:8px;
    background:#fff7f3;color:var(--orange-dark);
    font-size:13px;cursor:pointer;
  }
  .reset:active{background:var(--orange-soft)}

  /* ============ 结果卡片 ============ */
  .list{padding:0 16px}
  .card{
    background:#fff;border-radius:12px;margin-bottom:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;
    transition:box-shadow .22s ease;
  }
  .card.open{box-shadow:0 4px 16px rgba(0,0,0,.1)}
  .head{
    position:relative;display:block;
    width:100%;padding:13px 108px 13px 14px;
    border:0;background:none;text-align:left;cursor:pointer;color:inherit;
  }
  .info{display:block;min-width:0}
  .thumb{
    position:absolute;top:13px;right:13px;bottom:13px;width:88px;
    border-radius:9px;overflow:hidden;background:#f1f1f1;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
  }
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .l1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#a5a5a5;letter-spacing:.4px}
  .cat{font-size:11px;color:var(--orange-dark);background:var(--orange-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .chev{margin-left:auto;color:#c4c4c4;font-size:11px;line-height:1;transition:transform .25s ease}
  .card.open .chev{transform:rotate(180deg)}
  .scene{display:block;font-size:16px;font-weight:700;color:#333;line-height:1.45;margin-bottom:5px;word-break:break-word}
  .perf{display:block;font-size:14px;font-weight:700;color:var(--orange);line-height:1.55;margin-bottom:8px;word-break:break-word}
  .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .thk{font-size:13px;color:var(--blue);background:var(--blue-soft);padding:2px 8px;border-radius:6px;line-height:1.5}
  .src{font-size:12px;color:var(--green);background:var(--green-soft);padding:3px 8px;border-radius:6px;line-height:1.45}

  .body{
    max-height:0;overflow:hidden;opacity:0;
    transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .2s ease;
  }
  .card.open .body{opacity:1}
  .binner{border-top:1px dashed #eee;padding:10px 14px 12px}
  .drow{display:flex;gap:10px;padding:5px 0;line-height:1.55}
  .dk{flex:0 0 62px;font-size:12px;color:var(--muted)}
  .dv{flex:1;min-width:0;font-size:13px;color:#333;word-break:break-word}

  /* 空状态 */
  .empty{display:none;text-align:center;padding:56px 24px;color:#b0b0b0;font-size:13px;line-height:1.6}
  .empty.show{display:block}
  .empty .big{font-size:15px;color:#8d8d8d;margin-bottom:6px;font-weight:600}

  /* ============ 标题行 / 二维码入口 ============ */
  .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .qr-trigger{
    flex:0 0 auto;width:40px;height:40px;margin-top:2px;padding:0;
    border:1px solid rgba(255,255,255,.55);border-radius:10px;
    background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .qr-trigger:active{background:rgba(255,255,255,.32)}

  /* ============ 指标筛选 ============ */
  .metric-chips{padding:0 0 9px}
  .metric-chips .chip{background:#f4f4f4;color:#555;font-size:12px;padding:6px 12px}
  .metric-chips .chip.active{background:var(--orange);color:#fff;box-shadow:none}
  .add-btn{
    width:100%;height:38px;margin-top:10px;border:0;border-radius:8px;
    background:var(--orange);color:#fff;font-size:13px;font-weight:600;cursor:pointer;
    box-shadow:0 2px 8px rgba(255,107,53,.28);
  }
  .add-btn:active{background:var(--orange-dark)}
  .af-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .af{
    display:flex;align-items:center;gap:2px;
    background:#fff4ef;border:1px solid #ffd8c8;color:var(--orange-dark);
    font-size:12px;border-radius:999px;padding:3px 4px 3px 10px;line-height:1.4;
  }
  .af button{
    border:0;background:none;color:#d98463;font-size:14px;line-height:1;
    padding:0 4px;cursor:pointer;
  }

  /* ============ 卡片工艺参数 ============ */
  .tech{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
  .tk{
    font-size:11px;color:#666;background:#f6f6f6;
    border:1px solid #ececec;border-radius:6px;padding:2px 5px;line-height:1.45;
    white-space:nowrap;
  }
  .ref{
    font-size:9px;color:#b3b3b3;border:1px dashed #ddd;border-radius:4px;
    padding:1px 3px;line-height:1.4;white-space:nowrap;
  }
  .dnote{
    font-size:11px;color:#adadad;line-height:1.5;margin-top:8px;
    padding-top:8px;border-top:1px dashed #f2f2f2;
  }

  /* ============ 二维码弹窗 ============ */
  .mask{
    position:fixed;inset:0;z-index:200;padding:24px;
    background:rgba(0,0,0,.55);
    display:none;align-items:center;justify-content:center;
  }
  .mask.show{display:flex}
  .qr-card{
    width:100%;max-width:320px;background:#fff;border-radius:16px;
    padding:20px 18px 16px;text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.28);
    animation:pop .22s ease;
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .qr-title{margin:0;font-size:16px;font-weight:700;color:#333}
  .qr-sub{margin:4px 0 12px;font-size:12px;color:#999}
  .qr-box{width:216px;height:216px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
  .qr-box svg{width:100%;height:100%;display:block}
  .qr-url{
    font-size:12px;color:#666;background:#f7f7f7;border-radius:8px;
    padding:8px 10px;line-height:1.5;word-break:break-all;
    margin-bottom:12px;text-align:left;user-select:all;-webkit-user-select:all;
  }
  .qr-btns{display:flex;gap:10px}
  .qr-btn{
    flex:1;height:40px;border:1px solid #e5e5e5;border-radius:10px;
    background:#fff;color:#555;font-size:13px;cursor:pointer;
  }
  .qr-btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
  .qr-btn.primary.ok{background:#2E9E5B;border-color:#2E9E5B}

  /* ============ 底部统计 ============ */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-top:1px solid #eee;
    padding:7px 16px;padding-bottom:calc(7px + env(safe-area-inset-bottom));
  }
  .bar-in{max-width:600px;margin:0 auto;text-align:center}
  .bar-main{font-size:12px;color:#666}
  .bar-main b{color:var(--orange);font-weight:700}
  .sep{margin:0 7px;color:#dcdcdc}
  .bar-note{font-size:11px;color:#ababab;margin-top:2px;line-height:1.35}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="title-row">
      <div>
        <h1>喷涂数据参数库</h1>
        <p class="sub">特殊功能性涂层查询系统</p>
      </div>
      <button class="qr-trigger" id="qrOpen" type="button" aria-label="扫码查看本页">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <path d="M14 14h3v3h-3zM21 15v2M15 21h2M19 19h2v2"></path>
        </svg>
      </button>
    </div>
    <div class="search">
      <svg class="sicon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b5b5b5" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5 21 21"></path>
      </svg>
      <input id="search" type="search" autocomplete="off" placeholder="搜索场景/材料/型号/编号…">
      <button class="clear" id="clearBtn" type="button" aria-label="清除搜索">×</button>
    </div>
  </div>
</header>

<main class="main">
  <div class="cat-wrap">
    <div class="chips" id="catChips"></div>
  </div>

  <div class="scene-row">
    <span class="row-label">场景</span>
    <div class="chips" id="sceneChips"></div>
  </div>

  <section class="fp" id="fp">
    <button class="fp-head" id="fpHead" type="button" aria-expanded="false">
      <span>数值范围筛选</span>
      <span class="fp-val" id="fpVal">未设置</span>
      <span class="chev">▾</span>
    </button>
    <div class="fp-body" id="fpBody">
      <div class="fp-inner">
        <div class="chips metric-chips" id="metricChips"></div>
        <div class="frow">
          <div class="finput">
            <label for="minT" id="minLabel">最小值 (μm)</label>
            <input id="minT" type="number" inputmode="decimal" min="0" step="any" placeholder="不限">
          </div>
          <div class="finput">
            <label for="maxT" id="maxLabel">最大值 (μm)</label>
            <input id="maxT" type="number" inputmode="decimal" min="0" step="any" placeholder="不限">
          </div>
        </div>
        <button class="add-btn" id="addFilterBtn" type="button">添加筛选条件</button>
        <div class="af-wrap" id="activeList"></div>
        <p class="fhint">先选指标，再填范围，可连续添加多个条件叠加筛选；范围值取最小值；无该项数值的条目在该条件启用时会被过滤掉。</p>
        <button class="reset" id="resetBtn" type="button">重置全部筛选</button>
      </div>
    </div>
  </section>

  <div class="list" id="list"></div>
  <div class="empty" id="empty">
    <div class="big">未找到匹配参数</div>
    <div>请调整筛选条件</div>
  </div>
</main>

<footer class="bar">
  <div class="bar-in">
    <div class="bar-main">共收录 <b>50</b> 条参数<span class="sep">|</span>当前显示 <b id="cur">50</b> 条</div>
    <div class="bar-note">参数仅供参考，具体施工以设计要求和材料厂家说明为准</div>
  </div>
</footer>

<div class="mask" id="qrMask">
  <div class="qr-card" role="dialog" aria-modal="true" aria-label="扫码查看本页">
    <h2 class="qr-title">扫码查看 / 分享</h2>
    <p class="qr-sub">手机相机扫码即可打开本查询页</p>
    <div class="qr-box" id="qrBox"></div>
    <div class="qr-url" id="qrUrl"></div>
    <div class="qr-btns">
      <button class="qr-btn" id="qrClose" type="button">关闭</button>
      <button class="qr-btn primary" id="qrCopy" type="button">复制链接</button>
    </div>
  </div>
</div>

  var CATS = ['全部','防静电','防火阻燃','防爆抗爆','绝缘导热','防腐','防水','耐磨防滑'];

  /* 膜厚统一换算为 μm（范围值取最小值） */
  function toMicron(t){
    if(!t) return null;
    var m = String(t).match(/(\d+(?:\.\d+)?)\s*(?:(?:[-~±])\s*\d+(?:\.\d+)?\s*)?(mm|μm|um)/i);
    if(!m) return null;
    var v = parseFloat(m[1]);
    if(isNaN(v)) return null;
    return m[2].toLowerCase() === 'mm' ? Math.round(v*1000) : v;
  }
  /* 可筛选的数值指标（加载时逐条预计算） */
  var SUP_DIGITS = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
  function numFrom(str, re){
    var m = String(str).match(re);
    if(!m) return null;
    var v = parseFloat(m[1]);
    return isNaN(v) ? null : v;
  }
  function expFrom(str, re){
    var m = String(str).match(re);
    if(!m) return null;
    var s = m[1].replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, function(c){ return SUP_DIGITS[c]; });
    var v = parseInt(s, 10);
    return isNaN(v) ? null : v;
  }
  var METRICS = [
    {key:'um',    label:'膜厚',        unit:'μm',     pick:function(d){ return d.um; }},
    {key:'fire',  label:'耐火极限',    unit:'h',      pick:function(d){ return numFrom(d.performance, /耐火极限\s*([\d.]+)\s*h/); }},
    {key:'impact',label:'抗冲击',      unit:'kPa',    pick:function(d){ return numFrom(d.performance, /抗冲击\s*([\d.]+)\s*kPa/); }},
    {key:'surf',  label:'表面电阻指数',unit:'10ⁿΩ',   pick:function(d){ return expFrom(d.performance, /表面电阻\s*10([⁰¹²³⁴⁵⁶⁷⁸⁹]+)\s*Ω/); }},
    {key:'insu',  label:'绝缘电阻指数',unit:'10ⁿΩ',   pick:function(d){ return expFrom(d.performance, /绝缘电阻\s*10([⁰¹²³⁴⁵⁶⁷⁸⁹]+)\s*Ω/); }},
    {key:'cond',  label:'导热系数',    unit:'W/(m·K)', pick:function(d){ return numFrom(d.performance, /导热系数\s*([\d.]+)\s*W/); }},
    {key:'tens',  label:'拉伸强度',    unit:'MPa',    pick:function(d){ return numFrom(d.performance, /拉伸强度\s*≥?\s*([\d.]+)\s*MPa/); }},
    {key:'comp',  label:'抗压强度',    unit:'MPa',    pick:function(d){ return numFrom(d.performance, /抗压(?:强度)?(?:[\d]+d)?\s*≥?\s*([\d.]+)\s*MPa/); }},
    {key:'abra',  label:'耐磨性',      unit:'g',      pick:function(d){ return numFrom(d.performance, /耐磨性\s*≤?\s*([\d.]+)\s*g/); }},

    {key:'life',  label:'耐久年限',    unit:'年',     pick:function(d){ return numFrom(d.performance, /耐久\s*([\d.]+)(?:\s*-\s*[\d.]+)?\s*年/); }}
  ];

  /* ---------- 标签 ---------- */
  function buildChips(el, items, key){
    var html = '';

      state[key] = btn.getAttribute('data-v');

      for(var i=0;i<chips.length;i++){

  function addFilter(){
    var min = parseNum(minEl.value), max = parseNum(maxEl.value);
    if(min === null && max === null) return;
    if(min !== null && max !== null && min > max){ var t = min; min = max; max = t; }
    activeFilters = activeFilters.filter(function(f){ return f.key !== selectedMetric; });
    activeFilters.push({key:selectedMetric, min:min, max:max});
    minEl.value = '';
    maxEl.value = '';
    renderActiveFilters();
    renderList();
  }
  document.getElementById('addFilterBtn').addEventListener('click', addFilter);

  /* ---------- 筛选 ---------- */
  function filterData(){
    var q = state.q.trim().toLowerCase();
    return DATA.filter(function(d){
      if(state.cat !== '全部' && d.category !== state.cat) return false;
      if(state.scene !== '全部' && d.scene.indexOf(state.scene) === -1) return false;
      if(q && d.searchText.indexOf(q) === -1) return false;
      for(var i=0;i<activeFilters.length;i++){
        var f = activeFilters[i], v = d.metrics[f.key];
        if(v === null || v === undefined) return false;
        if(f.min !== null && v < f.min) return false;
        if(f.max !== null && v > f.max) return false;
      }
      return true;
    });
  }

    return '<article class="card'+(open?' open':'')+'" data-id="'+esc(d.id)+'">'
      + '<div class="head" role="button" tabindex="0" aria-expanded="'+(open?'true':'false')+'">'
      +   '<span class="info">'
      +     '<span class="l1"><span class="id">'+esc(d.id)+'</span><span class="cat">'+esc(d.category)+'</span><span class="chev">▾</span></span>'
      +     '<span class="scene">'+esc(d.scene)+'</span>'
      +     '<span class="perf">'+esc(d.performance)+'</span>'
      +     '<span class="tags"><span class="thk">'+esc(d.thickness)+'</span><span class="src">'+esc(d.source)+'</span></span>'
      +     '<span class="tech"><span class="tk">角度 '+esc(shortVal(d.angle))+'</span><span class="tk">压力 '+esc(shortVal(d.pressure))+'</span><span class="ref">参考值</span></span>'
      +   '</span>'
      +   '<span class="thumb"><img src="'+imgFor(d)+'" alt="'+esc(d.scene)+'" loading="lazy" decoding="async"></span>'
      + '</div>'
      + '<div class="body"><div class="binner">'+rowsHTML+'</div></div>'
      + '</article>';
  }

  function renderList(){
    var items = filterData();
    var html = '';
    for(var i=0;i<items.length;i++) html += cardHTML(items[i]);
    listEl.innerHTML = html;
    emptyEl.classList.toggle('show', items.length === 0);
    curEl.textContent = items.length;

    /* 恢复已展开卡片的实际高度 */
    var openBodies = listEl.querySelectorAll('.card.open .body');
    for(var j=0;j<openBodies.length;j++){
      openBodies[j].style.maxHeight = openBodies[j].firstElementChild.scrollHeight + 'px';
    }
  }

  function toggleCard(head){
    var card = head.parentNode;
    var body = card.querySelector('.body');
    var open = !card.classList.contains('open');
    card.classList.toggle('open', open);
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    body.style.maxHeight = open ? (body.firstElementChild.scrollHeight + 'px') : '0px';
    if(open) expanded[card.getAttribute('data-id')] = true;
    else delete expanded[card.getAttribute('data-id')];
  }

  listEl.addEventListener('click', function(e){
    var head = e.target.closest ? e.target.closest('.head') : null;
    if(head) toggleCard(head);
  });
  listEl.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var head = e.target.closest ? e.target.closest('.head') : null;
    if(!head) return;
    e.preventDefault();
    toggleCard(head);
  });

  var rzTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(rzTimer);
    rzTimer = setTimeout(function(){
      var bodies = listEl.querySelectorAll('.card.open .body');
      for(var i=0;i<bodies.length;i++){
        bodies[i].style.maxHeight = bodies[i].firstElementChild.scrollHeight + 'px';
      }
      measureFp();
    }, 150);
  });

  /* ---------- 二维码扫码查看 ---------- */
  var qrMaskEl = document.getElementById('qrMask');
  var qrBoxEl = document.getElementById('qrBox');
  var qrUrlEl = document.getElementById('qrUrl');
  var qrCopyEl = document.getElementById('qrCopy');
  var qrBuiltFor = null;

  function pageUrl(){ return location.href.split('#')[0]; }

  function openQr(){
    var url = pageUrl();
    qrCopyEl.textContent = '复制链接';
    qrCopyEl.classList.remove('ok');
    if(qrBuiltFor !== url){
      try{
        var qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        qrBoxEl.innerHTML = qr.createSvgTag({cellSize: 8, margin: 4, scalable: true});
        qrBuiltFor = url;
      }catch(err){
        qrBoxEl.innerHTML = '<div class="qr-sub">二维码生成失败</div>';
      }
    }
    qrUrlEl.textContent = url;
    qrMaskEl.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeQr(){
    qrMaskEl.classList.remove('show');
    document.body.style.overflow = '';
  }
  document.getElementById('qrOpen').addEventListener('click', openQr);
  document.getElementById('qrClose').addEventListener('click', closeQr);
  qrMaskEl.addEventListener('click', function(e){ if(e.target === qrMaskEl) closeQr(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && qrMaskEl.classList.contains('show')) closeQr(); });

  qrCopyEl.addEventListener('click', function(){
    var url = pageUrl();
    function flash(text, isOk){
      qrCopyEl.textContent = text;
      qrCopyEl.classList.toggle('ok', !!isOk);
    }
    function legacyCopy(){
      var ta = document.createElement('textarea');
      ta.value = url;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, url.length);
      var done = false;
      try{ done = document.execCommand('copy'); }catch(err){ done = false; }
      document.body.removeChild(ta);
      return done;
    }
    if(legacyCopy()){
      flash('已复制', true);
    }else{
      /* 同步给出提示；若剪贴板 API 成功，再切换为“已复制” */
      flash('请长按链接复制', false);
      if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
        navigator.clipboard.writeText(url).then(function(){ flash('已复制', true); }, function(){});
      }
    }
  });

  /* ---------- 初始化 ---------- */
  buildChips(catEl, CATS, 'cat');
  buildChips(sceneEl, SCENE_KEYS, 'scene');
  buildMetricChips();
  updateMetricLabels();
  renderActiveFilters();
  renderList();
})();
</script>
</body>
</html>
